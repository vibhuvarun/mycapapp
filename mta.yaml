_schema-version: "3.3.0"
ID: mycapapp
version: 1.0.0

modules:

  - name: mycapapp-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: mycapapp-db
      - name: mycapapp-auth

  - name: mycapapp-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
    requires:
      - name: mycapapp-db

  - name: mycapapp-ui
    type: nodejs
    path: app
    parameters:
      memory: 128M
      disk-quota: 256M
    build-parameters:
      builder: npm-ci
    requires:
      - name: mycapapp-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:

  - name: mycapapp-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: mycapapp-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production